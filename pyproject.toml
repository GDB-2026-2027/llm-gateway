[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "LLM Gateway for Semantic Operators over Graph Databases"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "filelock>=4.2.6",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
oxigraph = [
    "pyoxigraph==0.5.11",
]
rdflib = [
    "rdflib>=7.1,<8",
]
